<!DOCTYPE html>
<html>
<head>
    <title>Medicine Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <h1>Medicine Reminder</h1>

        <div class="top-section">
            <h2>Welcome!</h2>
            <p>Here are your medicines for today.</p>
        </div>

        <div class="medicine-card">

            <h3>Paracetamol</h3>

            <p><b>Dosage:</b> 500 mg</p>
            <p><b>Time:</b> 09:00 AM</p>

            <button onclick="medicineTaken('Paracetamol')">
                ✓ Taken
            </button>

            <button onclick="medicineMissed('Paracetamol')">
                ✕ Missed
            </button>

        </div>

        <div class="medicine-card">

            <h3>Vitamin D</h3>

            <p><b>Dosage:</b> 1 Tablet</p>
            <p><b>Time:</b> 08:00 PM</p>

            <button onclick="medicineTaken('Vitamin D')">
                ✓ Taken
            </button>

            <button onclick="medicineMissed('Vitamin D')">
                ✕ Missed
            </button>

        </div>

        <div class="menu">

            <button onclick="window.location.href='add-medicine.html'">
                + Add Medicine
            </button>

            <button onclick="window.location.href='history.html'">
                View History
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
